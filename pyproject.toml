[project]
name = "pydantic-squads"
version = "0.1.0"
description = "Declarative, validated agent squads on top of Pydantic AI"
readme = "README.md"
license = "MIT"
authors = [{ name = "Danilo Saletti" }]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Framework :: Pydantic :: 2",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Source = "https://github.com/dansaletti/pydantic-squads"

[project.scripts]
pydantic-squads = "pydantic_squads.cli:main"

[project.optional-dependencies]
ai = [
    "pydantic-ai-slim>=2.51.0",
]
skills = [
    "pydantic-ai-skills>=2.0.0",
]
observability = [
    "rich>=13.0",
]
otel = [
    "logfire>=3.0",
]

[dependency-groups]
dev = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
addopts = "-v"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_squads"]
